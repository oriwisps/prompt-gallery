<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车 · SVG 动画</title>
  <style>
/* 鹈鹕骑自行车 · 2D SVG 动画 */

:root {
  --ink: #2b2b2b;
  --muted: #6b6b6b;
  --card: #ffffff;
  --accent: #e63946;
  --accent-soft: #ffe5e8;
  --bg-a: #f7f3ea;
  --bg-b: #e8f0f6;
  --radius: 18px;
  --speed: 1;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, var(--bg-b), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, var(--accent-soft), transparent 55%),
    linear-gradient(180deg, var(--bg-a), #efe8dc);
  display: flex;
  justify-content: center;
  padding: 32px 16px 48px;
}

.stage {
  width: min(920px, 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.title {
  margin: 0;
  font-size: clamp(28px, 5vw, 40px);
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--ink);
}

.subtitle {
  margin: 0 0 8px;
  font-size: 15px;
  color: var(--muted);
}

.canvas-wrap {
  width: 100%;
  border-radius: var(--radius);
  overflow: hidden;
  background: #fff;
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.8) inset,
    0 18px 40px rgba(40, 40, 40, 0.12),
    0 2px 8px rgba(40, 40, 40, 0.06);
  border: 1px solid rgba(0, 0, 0, 0.06);
}

.scene {
  display: block;
  width: 100%;
  height: auto;
  background: #7ec8e8;
}

/* ---------- 角色与自行车整体颠簸 ---------- */
.rider-bob {
  animation: bob calc(0.55s / var(--speed)) ease-in-out infinite;
  transform-box: view-box;
}

@keyframes bob {
  0%,
  100% {
    transform: translate(380px, 280px) translateY(0);
  }
  50% {
    transform: translate(380px, 280px) translateY(-5px);
  }
}

/* ---------- 通用旋转（车轮辐条 / 曲柄） ---------- */
.spin {
  transform-box: fill-box;
  transform-origin: center;
  animation: spin calc(0.55s / var(--speed)) linear infinite;
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

/* ---------- 腿的轻微摆动（配合蹬踏感觉） ---------- */
.leg-near {
  transform-box: fill-box;
  transform-origin: 50% 0%;
  animation: leg-step calc(0.55s / var(--speed)) linear infinite;
}

.leg-far {
  transform-box: fill-box;
  transform-origin: 50% 0%;
  animation: leg-step calc(0.55s / var(--speed)) linear infinite;
  animation-delay: calc(-0.275s / var(--speed));
  opacity: 0.75;
}

@keyframes leg-step {
  0%,
  100% {
    transform: rotate(-12deg);
  }
  50% {
    transform: rotate(12deg);
  }
}

/* ---------- 翅膀轻扇 ---------- */
.wing {
  transform-box: fill-box;
  transform-origin: 90% 40%;
  animation: flap calc(1.1s / var(--speed)) ease-in-out infinite;
}

@keyframes flap {
  0%,
  100% {
    transform: rotate(0deg) scaleY(1);
  }
  50% {
    transform: rotate(-8deg) scaleY(0.92);
  }
}

/* ---------- 喉囊轻晃 ---------- */
.pouch {
  transform-box: fill-box;
  transform-origin: 20% 20%;
  animation: pouch-wobble calc(0.7s / var(--speed)) ease-in-out infinite;
}

@keyframes pouch-wobble {
  0%,
  100% {
    transform: skewX(0deg) scaleY(1);
  }
  50% {
    transform: skewX(4deg) scaleY(1.05);
  }
}

/* ---------- 阴影随颠簸呼吸 ---------- */
.ground-shadow {
  animation: shadow-pulse calc(0.55s / var(--speed)) ease-in-out infinite;
  transform-box: fill-box;
  transform-origin: center;
}

@keyframes shadow-pulse {
  0%,
  100% {
    opacity: 0.18;
    transform: scaleX(1);
  }
  50% {
    opacity: 0.12;
    transform: scaleX(0.92);
  }
}

/* ---------- 速度线闪烁 ---------- */
.speed-lines {
  animation: speed-flicker calc(0.4s / var(--speed)) linear infinite;
}

@keyframes speed-flicker {
  0%,
  100% {
    opacity: 0.45;
    transform: translateX(0);
  }
  50% {
    opacity: 0.15;
    transform: translateX(-8px);
  }
}

/* ---------- 背景视差滚动（无缝） ---------- */
.parallax-far,
.parallax-clouds,
.parallax-near,
.parallax-road,
.parallax-stones {
  transform-box: view-box;
}

.parallax-far .tile-far,
.parallax-clouds .tile-clouds,
.parallax-near .tile-near,
.parallax-road .tile-road,
.parallax-stones .tile-stones {
  animation-name: scroll-x;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  transform-box: view-box;
}

.parallax-far .tile-far {
  animation-duration: calc(18s / var(--speed));
}

.parallax-clouds .tile-clouds {
  animation-duration: calc(22s / var(--speed));
}

.parallax-near .tile-near {
  animation-duration: calc(8s / var(--speed));
}

.parallax-road .tile-road {
  animation-duration: calc(2.2s / var(--speed));
}

.parallax-stones .tile-stones {
  animation-duration: calc(1.1s / var(--speed));
}

@keyframes scroll-x {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(-800px);
  }
}

/* ---------- 页面控件 ---------- */
.controls {
  display: flex;
  gap: 12px;
  margin-top: 6px;
}

.btn {
  appearance: none;
  border: 1px solid rgba(0, 0, 0, 0.08);
  background: #fff;
  color: var(--ink);
  font: inherit;
  font-size: 14px;
  padding: 10px 18px;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
  transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
}

.btn:hover {
  transform: translateY(-1px);
  border-color: var(--accent);
  background: var(--accent-soft);
}

.btn:active {
  transform: translateY(0);
}

.btn.is-active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.foot {
  margin-top: 8px;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.08em;
}

/* 暂停态 */
.scene.is-paused *,
.scene.is-paused {
  animation-play-state: paused !important;
}

@media (prefers-reduced-motion: reduce) {
  .rider-bob,
  .spin,
  .leg-near,
  .leg-far,
  .wing,
  .pouch,
  .ground-shadow,
  .speed-lines,
  .parallax-far .tile-far,
  .parallax-clouds .tile-clouds,
  .parallax-near .tile-near,
  .parallax-road .tile-road,
  .parallax-stones .tile-stones {
    animation: none !important;
  }
}

</style>

  <script>
/**
 * 鹈鹕骑自行车 · 交互控制
 * 暂停 / 继续，以及整体调速
 */
(function () {
  const scene = document.querySelector(".scene");
  const btnPause = document.getElementById("btn-pause");
  const btnSpeed = document.getElementById("btn-speed");

  if (!scene || !btnPause || !btnSpeed) return;

  const root = document.documentElement;
  let paused = false;
  let speed = 1;
  const speeds = [1, 1.5, 2, 0.75];
  let speedIndex = 0;

  function setSpeed(multiplier) {
    speed = multiplier;
    root.style.setProperty("--speed", String(speed));
    const label =
      speed === 1 ? "加速 ×2" : speed > 1 ? `加速 ×${speed}` : `减速 ×${speed}`;
    btnSpeed.textContent = label;
    btnSpeed.classList.toggle("is-active", speed !== 1);
  }

  function togglePause() {
    paused = !paused;
    scene.classList.toggle("is-paused", paused);
    btnPause.textContent = paused ? "继续" : "暂停";
    btnPause.classList.toggle("is-active", paused);
  }

  function cycleSpeed() {
    speedIndex = (speedIndex + 1) % speeds.length;
    setSpeed(speeds[speedIndex]);
  }

  btnPause.addEventListener("click", togglePause);
  btnSpeed.addEventListener("click", cycleSpeed);

  // 空格也能暂停
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" && e.target === document.body) {
      e.preventDefault();
      togglePause();
    }
  });

  setSpeed(1);
})();

</script>
