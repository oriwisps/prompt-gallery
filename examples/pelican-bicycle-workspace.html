<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: linear-gradient(180deg, #87ceeb 0%, #b8e4f5 45%, #d4f0c7 45%, #c8e6a0 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    h1 {
      color: #2c5f2d;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 16px;
      letter-spacing: 2px;
      text-shadow: 0 2px 4px rgba(255,255,255,0.5);
    }
    .stage {
      width: min(920px, 95vw);
      height: min(520px, 70vh);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(44, 95, 45, 0.25);
      background: #87ceeb;
    }
    svg { display: block; width: 100%; height: 100%; }

    /* ===== 云朵飘动 ===== */
    .cloud { animation: cloudDrift linear infinite; }
    .cloud-slow { animation-duration: 28s; }
    .cloud-mid  { animation-duration: 20s; animation-delay: -8s; }
    .cloud-fast { animation-duration: 14s; animation-delay: -4s; }
    @keyframes cloudDrift {
      from { transform: translateX(0); }
      to   { transform: translateX(-960px); }
    }

    /* ===== 地面滚动 ===== */
    .ground-scroll {
      animation: groundScroll 1.6s linear infinite;
    }
    @keyframes groundScroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-200px); }
    }

    /* ===== 车轮旋转 ===== */
    .wheel-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 0.55s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== 踏板圆周 ===== */
    .pedal-orbit {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 0.55s linear infinite;
    }

    /* ===== 腿部蹬踏（简化为上下摆动） ===== */
    .leg-front {
      transform-box: fill-box;
      transform-origin: 12% 10%;
      animation: pedalFront 0.55s ease-in-out infinite;
    }
    .leg-back {
      transform-box: fill-box;
      transform-origin: 15% 10%;
      animation: pedalBack 0.55s ease-in-out infinite;
    }
    @keyframes pedalFront {
      0%, 100% { transform: rotate(-18deg); }
      50%      { transform: rotate(16deg); }
    }
    @keyframes pedalBack {
      0%, 100% { transform: rotate(16deg); }
      50%      { transform: rotate(-18deg); }
    }

    /* ===== 身体轻微上下颠簸 ===== */
    .rider-bob {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: bob 0.55s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-3px); }
    }

    /* ===== 头部/喙轻微晃动 ===== */
    .head-sway {
      transform-box: fill-box;
      transform-origin: 80% 70%;
      animation: sway 1.1s ease-in-out infinite;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-3deg); }
      50%      { transform: rotate(4deg); }
    }

    /* ===== 喙囊鼓动 ===== */
    .pouch {
      transform-box: fill-box;
      transform-origin: 30% 20%;
      animation: pouchPulse 1.4s ease-in-out infinite;
    }
    @keyframes pouchPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.08, 1.12); }
    }

    /* ===== 翅膀扇动 ===== */
    .wing {
      transform-box: fill-box;
      transform-origin: 85% 20%;
      animation: wingFlap 0.9s ease-in-out infinite;
    }
    @keyframes wingFlap {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-22deg); }
    }

    /* ===== 尾羽飘动 ===== */
    .tail {
      transform-box: fill-box;
      transform-origin: 90% 50%;
      animation: tailWave 0.7s ease-in-out infinite;
    }
    @keyframes tailWave {
      0%, 100% { transform: rotate(-6deg); }
      50%      { transform: rotate(8deg); }
    }

    /* ===== 铃铛 ===== */
    .bell-ding {
      transform-box: fill-box;
      transform-origin: center;
      animation: ding 2.2s ease-in-out infinite;
    }
    @keyframes ding {
      0%, 88%, 100% { transform: rotate(0deg); }
      90% { transform: rotate(-25deg); }
      93% { transform: rotate(20deg); }
      96% { transform: rotate(-12deg); }
    }

    /* ===== 太阳光芒 ===== */
    .sun-rays {
      transform-box: fill-box;
      transform-origin: center;
      animation: rayspin 20s linear infinite;
    }
    @keyframes rayspin {
      to { transform: rotate(360deg); }
    }

    /* ===== 远景树滚动 ===== */
    .trees-scroll {
      animation: treesScroll 6s linear infinite;
    }
    @keyframes treesScroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-480px); }
    }
  </style>
</head>
<body>

      <!-- ============================================================ -->

      <!-- ============================================================ -->
      <g transform="translate(480, 470)">
        <!-- ---- 后轮（左） ---- -->
        <g transform="translate(-95, 0)">
          <circle r="52" fill="url(#tireGrad)"/>

        <!-- ---- 前轮（右） ---- -->

          <g class="wheel-spin">

            </g>
            <circle r="6" fill="#aaa"/>

          <circle r="5" fill="#888"/>
        </g>

        <!-- ---- 车架 ---- -->
        <g stroke="url(#frameGrad)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <!-- 后下叉：后轮 → 曲柄 -->
          <line x1="-95" y1="0" x2="0" y2="18"/>
          <!-- 后上叉区域 / 立管：曲柄上 → 座管 -->
          <line x1="0" y1="18" x2="-25" y2="-78"/>
          <!-- 下管：曲柄上 → 前叉顶 -->
          <line x1="0" y1="18" x2="72" y2="-70"/>
          <!-- 上管：座管顶 → 头管 -->
          <line x1="-25" y1="-78" x2="72" y2="-70"/>
          <!-- 后上叉：座管顶 → 后轮 -->
          <line x1="-25" y1="-78" x2="-95" y2="0"/>
          <!-- 前叉：头管 → 前轮 -->
          <line x1="72" y1="-70" x2="95" y2="0"/>
          <!-- 头管短段 -->
          <line x1="72" y1="-70" x2="78" y2="-88"/>
        </g>

        <!-- ---- 车把 ---- -->
        <g stroke="#333" stroke-width="6" fill="none" stroke-linecap="round">
          <path d="M 78,-88 Q 95,-100 110,-95"/>
          <!-- 握把 -->
          <line x1="108" y1="-96" x2="118" y2="-94" stroke="#222" stroke-width="9"/>
        </g>

        <!-- ---- 车铃 ---- -->
        <g class="bell-ding" transform="translate(95, -95)">
          <circle r="8" fill="#ffd60a" stroke="#e8a000" stroke-width="2"/>
          <circle r="3" fill="#e8a000"/>
        </g>

        <!-- ---- 座垫 ---- -->
        <g transform="translate(-25, -78)">
          <ellipse cx="0" cy="-6" rx="22" ry="8" fill="#222"/>
          <ellipse cx="-2" cy="-9" rx="18" ry="6" fill="#333"/>
          <!-- 座管 -->
          <line x1="4" y1="0" x2="8" y2="18" stroke="#555" stroke-width="5"/>
        </g>

        <!-- ---- 曲柄 + 踏板（绕中轴旋转） ---- -->
        <g transform="translate(0, 18)">
          <!-- 牙盘 -->
          <circle r="16" fill="none" stroke="#888" stroke-width="4"/>
          <circle r="5" fill="#999"/>
          <!-- 曲柄+踏板轨道 -->
          <g class="pedal-orbit">
            <line x1="0" y1="0" x2="28" y2="0" stroke="#555" stroke-width="5" stroke-linecap="round"/>
            <rect x="22" y="-5" width="18" height="10" rx="2" fill="#333"/>
            <line x1="0" y1="0" x2="-28" y2="0" stroke="#555" stroke-width="5" stroke-linecap="round"/>
            <rect x="-40" y="-5" width="18" height="10" rx="2" fill="#333"/>
          </g>
        </g>

        <!-- ---- 链条（示意） ---- -->
        <path d="M -95,0 Q -50,30 0,18" stroke="#666" stroke-width="3" fill="none" stroke-dasharray="4 3"/>
        <path d="M -95,-6 Q -50,20 0,12" stroke="#777" stroke-width="2" fill="none" stroke-dasharray="4 3"/>

        <!-- ============================================================ -->
        <!-- ===================== 鹈鹕骑手 ============================ -->
        <!-- ============================================================ -->
        <g class="rider-bob">

          <!-- ---- 腿（两根，交替蹬踏） ---- -->
          <!-- 远腿（先画，在身后） -->
          <g class="leg-back">
            <g transform="translate(-18, -72)">
              <!-- 大腿 -->
              <path d="M 0,0 L 12,35" stroke="#e8963e" stroke-width="14" stroke-linecap="round" fill="none"/>
              <!-- 小腿 -->
              <path d="M 12,35 L 6,68" stroke="#e8963e" stroke-width="12" stroke-linecap="round" fill="none"/>
              <!-- 蹼足 -->
              <ellipse cx="8" cy="72" rx="14" ry="7" fill="#ff9f1c" transform="rotate(-10, 8, 72)"/>
            </g>
          </g>

          <!-- ---- 车前篮 ---- -->
          <g transform="translate(105, -78)">
            <path d="M -14,0 L -10,22 Q 0,28 10,22 L 14,0 Z" fill="#deb887" stroke="#c4a06a" stroke-width="2"/>
            <line x1="-14" y1="6" x2="14" y2="6" stroke="#c4a06a" stroke-width="1.5"/>
            <line x1="-12" y1="13" x2="12" y2="13" stroke="#c4a06a" stroke-width="1.5"/>
            <!-- 篮里的小花 -->
            <g transform="translate(0, -6)">
              <line x1="0" y1="0" x2="0" y2="12" stroke="#2d6a2d" stroke-width="2"/>
              <circle cx="0" cy="-3" r="6" fill="#ff6b9d"/>
              <circle cx="0" cy="-3" r="2.5" fill="#ffd60a"/>
              <line x1="-6" y1="3" x2="-2" y2="12" stroke="#2d6a2d" stroke-width="1.5"/>
              <circle cx="-8" cy="0" r="4" fill="#ce93d8"/>
            </g>
            <!-- 挂钩连到车把 -->
            <line x1="-8" y1="0" x2="-5" y2="-14" stroke="#555" stroke-width="2"/>
          </g>

          <!-- ---- 近腿（前） ---- -->
          <g class="leg-front">
            <g transform="translate(-10, -74)">
              <path d="M 0,0 L 16,36" stroke="#f0a050" stroke-width="15" stroke-linecap="round" fill="none"/>
              <path d="M 16,36 L 10,70" stroke="#f0a050" stroke-width="13" stroke-linecap="round" fill="none"/>
              <ellipse cx="12" cy="74" rx="15" ry="8" fill="#ffb347" transform="rotate(-8, 12, 74)"/>
            </g>
          </g>

          <!-- ---- 尾羽 ---- -->
          <g class="tail" transform="translate(-70, -115)">
            <path d="M 0,0 Q -30,-10 -48,5 Q -30,8 -18,14 Q -32,20 -40,32 Q -20,25 -5,18 Z"
                  fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
            <path d="M 0,2 Q -22,0 -35,10" stroke="#ccc" stroke-width="1.5" fill="none"/>
          </g>

          <!-- ---- 身体 ---- -->
          <ellipse cx="-30" cy="-125" rx="58" ry="48" fill="url(#bodyGrad)" stroke="#ddd" stroke-width="1.5"/>
          <!-- 胸部略白 -->
          <ellipse cx="-5" cy="-118" rx="32" ry="35" fill="#fff" opacity="0.7"/>

          <!-- ---- 翅膀（扇动） ---- -->
          <g class="wing" transform="translate(-40, -135)">
            <path d="M 0,0 Q -35,10 -55,40 Q -40,55 -10,50 Q 15,45 20,20 Q 18,5 0,0 Z"
                  fill="#f0f0f0" stroke="#ccc" stroke-width="1.5"/>
            <!-- 翅尖深色 -->
            <path d="M -55,40 Q -48,48 -35,50 Q -42,42 -40,32 Z" fill="#555" opacity="0.7"/>
            <path d="M -48,28 Q -35,32 -20,30" stroke="#ddd" stroke-width="1.5" fill="none"/>
            <path d="M -50,35 Q -35,40 -18,38" stroke="#ddd" stroke-width="1.5" fill="none"/>
          </g>

          <!-- ---- 手/翅膀尖握车把 ---- -->
          <path d="M -15,-125 Q 40,-130 70,-115 Q 85,-112 105,-96"
                stroke="#e8e8e8" stroke-width="16" fill="none" stroke-linecap="round"/>
          <path d="M -15,-125 Q 40,-130 70,-115 Q 85,-112 105,-96"
                stroke="#f5f5f5" stroke-width="12" fill="none" stroke-linecap="round"/>
          <!-- 握把点 -->
          <ellipse cx="110" cy="-95" rx="12" ry="8" fill="#ff9f1c" transform="rotate(-15, 110, -95)"/>

          <!-- ---- 头部 + 头部动画组 ---- -->
          <g class="head-sway" transform="translate(10, -165)">
            <!-- 脖子 -->
            <path d="M -25,35 Q -10,10 5,-5" stroke="url(#bodyGrad)" stroke-width="28" fill="none" stroke-linecap="round"/>
            <path d="M -25,35 Q -10,10 5,-5" stroke="#fff" stroke-width="20" fill="none" stroke-linecap="round"/>

            <!-- 头 -->
            <ellipse cx="20" cy="-20" rx="32" ry="28" fill="#fff"/>
            <!-- 头顶一点淡橙 -->
            <ellipse cx="20" cy="-40" rx="18" ry="10" fill="#ffe0b2" opacity="0.6"/>

            <!-- 眼睛 -->
            <circle cx="32" cy="-26" r="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
            <circle cx="34" cy="-26" r="4.5" fill="#222"/>
            <circle cx="36" cy="-28" r="1.8" fill="#fff"/>
            <!-- 眼皮偶尔眨：用小弧线装饰 -->
            <path d="M 24,-32 Q 32,-36 40,-32" stroke="#333" stroke-width="1.5" fill="none"/>

            <!-- 眉毛（开心） -->
            <path d="M 24,-38 Q 32,-42 40,-38" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round"/>

            <!-- 喙（上喙） -->
            <path d="M 45,-22 L 110,-14 L 110,-8 L 48,-8 Z"
                  fill="url(#beakGrad)" stroke="#e67e00" stroke-width="1.5"/>
            <!-- 喙尖钩 -->
            <path d="M 110,-14 L 118,-10 L 110,-6" fill="#e67e00"/>

            <!-- 喉囊（鼓动） -->
            <g class="pouch">
              <path d="M 45,-8 Q 50,25 75,32 Q 100,28 110,0 L 110,-8 Z"
                    fill="#ffb347" stroke="#e67e00" stroke-width="1.5"/>
              <!-- 囊上纹理 -->
              <path d="M 55,0 Q 65,18 85,22" stroke="#e67e00" stroke-width="1.2" fill="none" opacity="0.6"/>
              <path d="M 60,8 Q 72,22 92,24" stroke="#e67e00" stroke-width="1.2" fill="none" opacity="0.5"/>
            </g>

            <!-- 下喙线 -->
            <path d="M 45,-8 L 110,-6" stroke="#e67e00" stroke-width="2" fill="none"/>
          </g>

          <!-- ---- 骑手帽子（小水手帽） ---- -->
          <g class="head-sway" transform="translate(10, -165)">
            <g transform="translate(18, -48)">
              <!-- 帽檐 -->
              <ellipse cx="0" cy="2" rx="30" ry="8" fill="#1e6091"/>
              <!-- 帽顶 -->
              <path d="M -20,2 Q -18,-18 0,-20 Q 18,-18 20,2 Z" fill="#2980b9"/>
              <!-- 帽带 -->
              <rect x="-20" y="-2" width="40" height="5" rx="2" fill="#e74c3c"/>
              <!-- 锚形小徽章 -->
              <circle cx="0" cy="-10" r="4" fill="#ffd60a"/>
            </g>
          </g>
        </g>
      </g>

      <!-- ============ 前景装饰：左下草丛 ============ -->
      <g opacity="0.9">
        <path d="M 0,540 Q 10,510 20,540 Q 30,500 45,540 Q 55,515 70,540 Z" fill="#4caf50"/>
        <path d="M 880,540 Q 890,505 905,540 Q 915,495 930,540 Q 945,510 960,540 Z" fill="#43a047"/>
      </g>

      <!-- ============ 飘动的音符 ============ -->
      <g fill="#e63946" font-family="serif" font-weight="bold">
        <g opacity="0.9">
          <text x="600" y="300" font-size="28">
            ♪
            <animate attributeName="y" values="320;260;200" dur="3s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
            <animate attributeName="x" values="590;610;625" dur="3s" repeatCount="indefinite"/>
          </text>
        </g>
        <g opacity="0.85">
          <text x="640" y="340" font-size="22" fill="#1e6091">
            ♫
            <animate attributeName="y" values="360;300;240" dur="3.5s" begin="0.8s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="0.8s" repeatCount="indefinite"/>
            <animate attributeName="x" values="635;655;670" dur="3.5s" begin="0.8s" repeatCount="indefinite"/>
          </text>
        </g>
        <g opacity="0.8">
          <text x="580" y="360" font-size="20" fill="#e67e00">
            ♪
            <animate attributeName="y" values="380;330;280" dur="4s" begin="1.6s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1.6s" repeatCount="indefinite"/>
            <animate attributeName="x" values="575;590;605" dur="4s" begin="1.6s" repeatCount="indefinite"/>
          </text>
        </g>
      </g>

    </svg>
  </div>
</body>
</html>
